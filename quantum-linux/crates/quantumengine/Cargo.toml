[package]
name = "quantumengine"
description = "Desktop window for JBL Quantum 810 Wireless headsets on Linux (Tauri shell over the quantumengined service)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Only for the lighting effect names and the colour limit; the window never
# opens the headset (quantumengined does).
jbl-quantum.workspace = true
quantumengine-dbus.workspace = true
zbus.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# The file chooser for importing EQ curves; called from Rust only.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
specta-typescript = "0.0.12"

[features]
# Serves the built `ui/dist` from inside the binary instead of loading the
# Vite dev server. Release builds turn it on (the PKGBUILD passes
# `--features quantumengine/custom-protocol`; `tauri build` does it itself).
custom-protocol = ["tauri/custom-protocol"]
