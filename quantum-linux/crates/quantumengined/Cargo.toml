[package]
name = "quantumengined"
description = "Background service for JBL Quantum 810 Wireless headsets: owns the headset, EQ, updates and tray icon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# `<[T]>::as_chunks_mut` (tray icon conversion).
rust-version = "1.88"

[dependencies]
jbl-quantum.workspace = true
quantumengine-dbus.workspace = true
zbus.workspace = true
serde = { version = "1", features = ["derive"] }
# Tray icon (StatusNotifierItem). async-io matches zbus's own default backend
# above, so the process runs one non-tokio executor, not two.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Decodes the embedded icon PNG into the ARGB pixels ksni wants.
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
serde_json = "1"
libc = "0.2"
# The FFTs behind virtual surround's head-model correction (`brir.rs`).
rustfft = "6"
