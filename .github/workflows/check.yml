# Lints and tests every push and pull request, on Arch like the users.
name: Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        working-directory: quantum-linux
    steps:
      - name: Install tools
        working-directory: /
        run: pacman -Syu --noconfirm --needed git rust

      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          source packaging/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"

      - name: Interface (typecheck and build)
        run: |
          npm --prefix ui ci --no-audit --no-fund
          npm --prefix ui run build

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace
