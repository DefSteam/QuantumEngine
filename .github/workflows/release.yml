# Builds the Arch package for a version tag and publishes it as a GitHub
# release. The QuantumEngine tray service checks these releases for updates
# and installs the attached package, so every release needs:
#   quantumengine-<version>-<rel>-x86_64.pkg.tar.zst
#   quantumengine-<version>-<rel>-x86_64.pkg.tar.zst.sha256
# The PKGBUILD with the source checksum filled in is attached too, ready for
# the AUR.
#
# To release: run quantum-linux/scripts/bump-version.sh, commit, then
#   git tag -a vX.Y.Z -m "vX.Y.Z" && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CARGO_HOME: ${{ github.workspace }}/quantum-linux/.ci-cache/cargo
    steps:
      - name: Install tools
        # JavaScript actions (including checkout) need Node inside this job
        # container. Keep the build user tooling explicit as well.
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib nodejs

      - uses: actions/checkout@v4

      - name: Select package cache window
        id: package-cache
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Arch package downloads
        uses: actions/cache@v4
        with:
          path: quantum-linux/.ci-cache/pacman
          key: ${{ runner.os }}-${{ runner.arch }}-pacman-${{ steps.package-cache.outputs.month }}-${{ hashFiles('quantum-linux/packaging/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pacman-${{ steps.package-cache.outputs.month }}-
            ${{ runner.os }}-${{ runner.arch }}-pacman-

      - name: Prepare shared Cargo cache directory
        run: mkdir -p "$CARGO_HOME"

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: quantum-linux/ui/.npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('quantum-linux/ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: quantum-linux -> target
          cache-directories: ${{ github.workspace }}/quantum-linux/.ci-cache/cargo
          shared-key: quantumengine-arch-${{ runner.arch }}
          add-job-id-key: false

      - name: Point the package recipe at this repository
        shell: bash
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          sed -i "s|^url=.*|url=\"$repo_url\"|" quantum-linux/packaging/PKGBUILD

      - name: Check the tag matches the version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd quantum-linux
          grep -qx "pkgver=$version" packaging/PKGBUILD || { echo "::error::PKGBUILD pkgver is not $version"; exit 1; }
          grep -qx "version = \"$version\"" Cargo.toml || { echo "::error::Cargo.toml version is not $version"; exit 1; }

      - name: Install build dependencies
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/quantum-linux/.ci-cache/pacman"
          source quantum-linux/packaging/PKGBUILD
          pacman -S --noconfirm --needed --cachedir "$GITHUB_WORKSPACE/quantum-linux/.ci-cache/pacman" "${depends[@]}" "${makedepends[@]}"

      # makepkg refuses to run as root.
      - name: Build the package
        shell: bash
        run: |
          useradd --create-home builder
          install -d -o builder /home/builder/pkg
          install -d -o builder -g builder "$GITHUB_WORKSPACE/quantum-linux/target" "$GITHUB_WORKSPACE/quantum-linux/.ci-cache/cargo" "$GITHUB_WORKSPACE/quantum-linux/ui/.npm-cache"
          chown -R builder:builder "$GITHUB_WORKSPACE/quantum-linux/target" "$GITHUB_WORKSPACE/quantum-linux/.ci-cache/cargo" "$GITHUB_WORKSPACE/quantum-linux/ui/.npm-cache"
          install -o builder -m644 quantum-linux/packaging/PKGBUILD /home/builder/pkg/
          cd /home/builder/pkg
          runuser -u builder -- updpkgsums
          runuser -u builder -- env \
            CARGO_HOME="$GITHUB_WORKSPACE/quantum-linux/.ci-cache/cargo" \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/quantum-linux/target" \
            NPM_CONFIG_CACHE="$GITHUB_WORKSPACE/quantum-linux/ui/.npm-cache" \
            makepkg --noconfirm
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /home/builder/pkg
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "QuantumEngine ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            ./*.pkg.tar.zst ./*.pkg.tar.zst.sha256 PKGBUILD
